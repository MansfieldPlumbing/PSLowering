name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore pinned PowerShell
        run: dotnet tool restore

      - name: Verify persistence
        run: dotnet tool run pwsh -- -NoLogo -NoProfile -File ./tests/Test-OneParameterPersistence.ps1

      - name: Verify SMA compilation
        run: dotnet tool run pwsh -- -NoLogo -NoProfile -File ./probes/Test-SmaCompilation.ps1 -BaselineOnly

      - name: Verify lowering toolchain
        run: dotnet tool run pwsh -- -NoLogo -NoProfile -File ./tests/Test-ConsolidatedRunner.ps1

